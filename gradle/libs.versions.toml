[versions]
# ── Core ───────────────────────────────────────────────────────────────────────
kotlin                = "2.2.0"
agp                   = "8.7.3"
compose-multiplatform = "1.7.3"

# ── AndroidX ──────────────────────────────────────────────────────────────────
android-minSdk        = "26"
android-compileSdk    = "36"
android-targetSdk     = "36"
androidx-activityCompose = "1.10.1"

# ── Networking ─────────────────────────────────────────────────────────────────
ktor                  = "3.1.2"
kotlinx-serialization = "1.8.0"
kotlinx-coroutines    = "1.10.1"

# ── Spring Boot ───────────────────────────────────────────────────────────────
springBoot            = "3.4.1"
springDependencyMgmt  = "1.1.7"

# ── Backend Utilities ─────────────────────────────────────────────────────────
jsoup                 = "1.23.2"
rome                  = "2.1.0"
flexmark              = "0.64.8"

# ── Persistence (Zero KSP) ────────────────────────────────────────────────────
# SQLDelight: pure Gradle plugin — NO KSP, NO KAPT, NO annotation processing
sqldelight            = "2.0.2"

# ── DI ────────────────────────────────────────────────────────────────────────
koin                  = "4.0.1"

# ── Image Loading ──────────────────────────────────────────────────────────────
coil                  = "3.1.0"

# ── Navigation ────────────────────────────────────────────────────────────────
navigation            = "2.8.0-alpha10"

[libraries]
# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlinx-coroutines-core   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ── Ktor ──────────────────────────────────────────────────────────────────────
ktor-client-core          = { module = "io.ktor:ktor-client-core",                         version.ref = "ktor" }
ktor-client-okhttp        = { module = "io.ktor:ktor-client-okhttp",                       version.ref = "ktor" }
ktor-client-darwin        = { module = "io.ktor:ktor-client-darwin",                       version.ref = "ktor" }
ktor-client-content-neg   = { module = "io.ktor:ktor-client-content-negotiation",          version.ref = "ktor" }
ktor-client-logging       = { module = "io.ktor:ktor-client-logging",                      version.ref = "ktor" }
ktor-serialization-json   = { module = "io.ktor:ktor-serialization-kotlinx-json",          version.ref = "ktor" }

# ── SQLDelight ────────────────────────────────────────────────────────────────
sqldelight-runtime        = { module = "app.cash.sqldelight:runtime",                      version.ref = "sqldelight" }
sqldelight-coroutines     = { module = "app.cash.sqldelight:coroutines-extensions",        version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver",               version.ref = "sqldelight" }
sqldelight-native-driver  = { module = "app.cash.sqldelight:native-driver",                version.ref = "sqldelight" }

# ── Koin ──────────────────────────────────────────────────────────────────────
koin-core                 = { module = "io.insert-koin:koin-core",                         version.ref = "koin" }
koin-android              = { module = "io.insert-koin:koin-android",                      version.ref = "koin" }
koin-compose              = { module = "io.insert-koin:koin-compose",                      version.ref = "koin" }

# ── Coil ──────────────────────────────────────────────────────────────────────
coil-compose              = { module = "io.coil-kt.coil3:coil-compose",                    version.ref = "coil" }
coil-network-ktor         = { module = "io.coil-kt.coil3:coil-network-ktor3",              version.ref = "coil" }

# ── Navigation ────────────────────────────────────────────────────────────────
navigation-compose        = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }

# ── AndroidX ──────────────────────────────────────────────────────────────────
androidx-activity-compose = { module = "androidx.activity:activity-compose",               version.ref = "androidx-activityCompose" }

# ── Spring Boot ───────────────────────────────────────────────────────────────
spring-boot-starter-web    = { module = "org.springframework.boot:spring-boot-starter-web",        version.ref = "springBoot" }
spring-boot-starter-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb", version.ref = "springBoot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux",      version.ref = "springBoot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator",    version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
jackson-module-kotlin      = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# ── Backend Utilities ─────────────────────────────────────────────────────────
jsoup                      = { module = "org.jsoup:jsoup",                                 version.ref = "jsoup" }
rometools-rome             = { module = "com.rometools:rome",                              version.ref = "rome" }
flexmark-html2md           = { module = "com.vladsch.flexmark:flexmark-html2md-converter",  version.ref = "flexmark" }

[plugins]
# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin-multiplatform      = { id = "org.jetbrains.kotlin.multiplatform",                   version.ref = "kotlin" }
kotlinJvm                 = { id = "org.jetbrains.kotlin.jvm",                             version.ref = "kotlin" }
kotlin-spring             = { id = "org.jetbrains.kotlin.plugin.spring",                   version.ref = "kotlin" }
kotlin-serialization      = { id = "org.jetbrains.kotlin.plugin.serialization",            version.ref = "kotlin" }
compose-multiplatform     = { id = "org.jetbrains.compose",                                version.ref = "compose-multiplatform" }
compose-compiler          = { id = "org.jetbrains.kotlin.plugin.compose",                  version.ref = "kotlin" }

# ── Android ───────────────────────────────────────────────────────────────────
android-application       = { id = "com.android.application",                              version.ref = "agp" }
android-library           = { id = "com.android.library",                                  version.ref = "agp" }

# ── Spring Boot ───────────────────────────────────────────────────────────────
springBoot                = { id = "org.springframework.boot",                             version.ref = "springBoot" }
springDependencyMgmt      = { id = "io.spring.dependency-management",                      version.ref = "springDependencyMgmt" }

# ── SQLDelight (Gradle plugin only — zero annotation processing) ───────────────
sqldelight                = { id = "app.cash.sqldelight",                                  version.ref = "sqldelight" }